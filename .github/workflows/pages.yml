name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf _site _unzipped
          mkdir -p _site
          unzip -q creadorcatalogobeta9.zip -d _unzipped
          shopt -s dotglob
          items=("_unzipped"/*)
          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -R "${items[0]}"/. _site/
          else
            cp -R _unzipped/. _site/
          fi
          rm -rf _unzipped
          test -f _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
